server:
  port: 8080
  address: 0.0.0.0
spring:
  application:
    name: ollama-java-api
  datasource:
    url: 'jdbc:postgresql://localhost:5432/ai_db'
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: '-1ms'
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false
      use-key-prefix: true
      key-prefix: 'ollama::'
      enable-statistics: on
  Jackson:
    serialization:
      write-dates-as-timestamps: false
logging:
  level:
    org.springframework.cache: info
    org.springframework.data.redis: info

ai:
  base:
    ollama:
      url: 'http://localhost:11434/api'
